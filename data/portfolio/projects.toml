pdf_include = false

[projects.en]
description = "Python library and CLI for managing Jelastic cloud environments — create, start, stop, delete, clone, and configure environments programmatically. Includes an MCP (Model Context Protocol) server that lets AI assistants like Claude directly interact with and manage cloud infrastructure."

[projects.fr]
description = "Bibliothèque Python et CLI pour gérer des environnements cloud Jelastic — créer, démarrer, arrêter, supprimer, cloner et configurer des environnements programmatically. Inclut un serveur MCP (Model Context Protocol) permettant aux assistants IA comme Claude d'interagir directement avec l'infrastructure cloud."

